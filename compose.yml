name: smart-surveillance-system

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: smart-surveillance-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SSS_DB_NAME:-surveillance}
      POSTGRES_USER: ${SSS_DB_USER:-surveillance}
      POSTGRES_PASSWORD: ${SSS_DB_PASSWORD:-surveillance}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cams]

  go2rtc:
    image: alexxit/go2rtc:1.9.14-hardware
    container_name: smart-surveillance-system-go2rtc
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    environment:
      SSS_TV_RTSP_USERNAME: ${SSS_TV_RTSP_USERNAME:-tv}
      SSS_TV_RTSP_PASSWORD: ${SSS_TV_RTSP_PASSWORD:?set SSS_TV_RTSP_PASSWORD}
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
      - ./go2rtc-tv.sh:/config/tv.sh:ro
    ports:
      - "${SSS_LAN_BIND:?set SSS_LAN_BIND to this machine LAN address}:8554:8554"
    networks: [cams]

  backend:
    build: ./backend
    image: smart-surveillance-system-backend:local
    container_name: smart-surveillance-system-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - events:/data/events
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_started
    networks: [cams]

  analytics:
    build:
      context: ./analytics
      target: runtime
    image: smart-surveillance-system-analytics:local
    container_name: smart-surveillance-system-analytics
    restart: unless-stopped
    env_file: .env
    environment:
      SSS_ANALYTICS_BACKEND_URL: http://backend:8000

      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    volumes:
      - ${SSS_ANALYTICS_MODELS_DIR:-./analytics/models}:/models:ro
      - ${SSS_ANALYTICS_FACE_MODELS_DIR:-./analytics/models/face}:/face-models:ro
      - analytics-engines:/engines
      - events:/data/events
      - type: tmpfs
        target: /buffer
        tmpfs:
          size: 1073741824
          mode: 01777
    depends_on:
      backend:
        condition: service_started
      go2rtc:
        condition: service_started
    networks: [cams]

  v380-ptz-1:
    build: ./v380-bridge
    image: smart-surveillance-system-v380-bridge:local
    container_name: smart-surveillance-system-v380-ptz-1
    restart: unless-stopped
    command:
      - --id
      - ${V380_PTZ_1_ID:?set V380_PTZ_1_ID}
      - --username
      - ${V380_USERNAME:-admin}
      - --password
      - ${V380_PASSWORD:?set V380_PASSWORD}
      - --ip
      - ${V380_PTZ_1_HOST:?set V380_PTZ_1_HOST}
      - --output
      - rtsp
      - --enable-onvif
      - --enable-api
      - --rtsp-port
      - "8554"
      - --http-port
      - "8080"
    networks: [cams]

  v380-ptz-2:
    build: ./v380-bridge
    image: smart-surveillance-system-v380-bridge:local
    container_name: smart-surveillance-system-v380-ptz-2
    restart: unless-stopped
    command:
      - --id
      - ${V380_PTZ_2_ID:?set V380_PTZ_2_ID}
      - --username
      - ${V380_USERNAME:-admin}
      - --password
      - ${V380_PASSWORD:?set V380_PASSWORD}
      - --ip
      - ${V380_PTZ_2_HOST:?set V380_PTZ_2_HOST}
      - --output
      - rtsp
      - --enable-onvif
      - --enable-api
      - --rtsp-port
      - "8554"
      - --http-port
      - "8080"
    networks: [cams]

  web:
    build: ./frontend
    image: smart-surveillance-system-web:local
    container_name: smart-surveillance-system-web
    restart: unless-stopped
    depends_on: [backend, go2rtc]
    ports:
      - "127.0.0.1:${SSS_WEB_PORT:-8750}:80"
      - "${SSS_LAN_BIND:?set SSS_LAN_BIND to this machine LAN address}:${SSS_WEB_PORT:-8750}:80"
    networks: [cams]

volumes:
  postgres:
  events:
  analytics-engines:

networks:
  cams:
