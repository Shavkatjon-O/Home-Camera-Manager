name: home-cameras

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: home-cameras-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HC_DB_NAME:-home_cameras}
      POSTGRES_USER: ${HC_DB_USER:-home_cameras}
      POSTGRES_PASSWORD: ${HC_DB_PASSWORD:-home_cameras}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cams]

  go2rtc:
    image: alexxit/go2rtc:1.9.14-hardware
    container_name: home-cameras-go2rtc
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    networks: [cams]

  backend:
    build: ./backend
    image: home-cameras-backend:local
    container_name: home-cameras-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_started
    networks: [cams]

  v380-ptz-1:
    build: ./v380-bridge
    image: home-cameras-v380-bridge:local
    container_name: home-cameras-v380-ptz-1
    restart: unless-stopped
    command:
      - --id
      - ${V380_PTZ_1_ID:?set V380_PTZ_1_ID}
      - --username
      - ${V380_USERNAME:-admin}
      - --password
      - ${V380_PASSWORD:?set V380_PASSWORD}
      - --ip
      - ${V380_PTZ_1_HOST:?set V380_PTZ_1_HOST}
      - --output
      - rtsp
      - --enable-onvif
      - --rtsp-port
      - "8554"
      - --http-port
      - "8080"
    networks: [cams]

  v380-ptz-2:
    build: ./v380-bridge
    image: home-cameras-v380-bridge:local
    container_name: home-cameras-v380-ptz-2
    restart: unless-stopped
    command:
      - --id
      - ${V380_PTZ_2_ID:?set V380_PTZ_2_ID}
      - --username
      - ${V380_USERNAME:-admin}
      - --password
      - ${V380_PASSWORD:?set V380_PASSWORD}
      - --ip
      - ${V380_PTZ_2_HOST:?set V380_PTZ_2_HOST}
      - --output
      - rtsp
      - --enable-onvif
      - --rtsp-port
      - "8554"
      - --http-port
      - "8080"
    networks: [cams]

  web:
    build: ./frontend
    image: home-cameras-web:local
    container_name: home-cameras-web
    restart: unless-stopped
    depends_on: [backend, go2rtc]
    ports:
      - "127.0.0.1:${HC_WEB_PORT:-8750}:80"
      - "${HC_LAN_BIND:?set HC_LAN_BIND to this machine home network address}:${HC_WEB_PORT:-8750}:80"
    networks: [cams]

volumes:
  postgres:

networks:
  cams:
