services:
  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/sss_db_password
    secrets:
      - sss_db_password

  backend:
    secrets:
      - sss_db_password
      - sss_secret_key

  analytics:
    secrets:
      - sss_db_password

secrets:
  sss_db_password:
    file: ${SSS_SECRETS_DIR:?set SSS_SECRETS_DIR to the folder of the secret files}/sss_db_password
  sss_secret_key:
    file: ${SSS_SECRETS_DIR:?set SSS_SECRETS_DIR to the folder of the secret files}/sss_secret_key
