[project]
name = "smart-surveillance-backend"
version = "0.1.0"
description = "Camera registry, live view, PTZ control, events and analytics API of Smart Surveillance System"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "bcrypt>=4.3",
    "cryptography>=45.0",
    "fastapi>=0.120",
    "httpx>=0.28",
    "numpy>=2.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["D"]
"migrations/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
