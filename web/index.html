<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Cameras</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📹</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot-rec"></span>
      <span>Home Cameras</span>
    </div>
    <div class="controls">
      <button id="layoutBtn" class="btn" title="Toggle layout">Grid</button>
      <button id="muteBtn" class="btn" title="Mute / unmute">Muted</button>
      <button id="fsBtn" class="btn" title="Fullscreen">Fullscreen</button>
      <span id="clock" class="clock"></span>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
