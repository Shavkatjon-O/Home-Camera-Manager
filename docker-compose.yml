name: home-cameras

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    networks: [cams]

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [go2rtc]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8750:80"
    networks: [cams]

networks:
  cams:
    driver: bridge
