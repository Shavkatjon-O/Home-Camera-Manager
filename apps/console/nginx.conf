server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /internal/auth {
        internal;
        proxy_pass http://backend:8000/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/v1/events/stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /go2rtc/api/ws {
        auth_request /internal/auth;
        proxy_pass http://go2rtc:1984/api/ws;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /go2rtc/api/frame.jpeg {
        auth_request /internal/auth;
        limit_except GET { deny all; }
        proxy_pass http://go2rtc:1984/api/frame.jpeg;
    }

    location = /go2rtc/video-rtc.js {
        limit_except GET { deny all; }
        proxy_pass http://go2rtc:1984/video-rtc.js;
    }

    location /go2rtc/ {
        return 404;
    }

    location /internal/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
