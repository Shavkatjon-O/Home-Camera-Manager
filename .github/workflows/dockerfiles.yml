name: dockerfiles

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - ".github/workflows/dockerfiles.yml"
  pull_request:
    paths:
      - "**/Dockerfile"
      - ".github/workflows/dockerfiles.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint every Dockerfile
        run: |
          status=0
          for file in $(git ls-files '*Dockerfile'); do
            echo "== $file"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:v2.12.0 < "$file" || status=1
          done
          exit $status
