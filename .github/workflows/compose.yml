name: compose

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.jetson.yml"
      - ".env.example"
      - "deploy/**"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.jetson.yml"
      - ".env.example"
      - "deploy/**"
      - ".github/workflows/compose.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SSS_TV_RTSP_PASSWORD: example
  V380_PASSWORD: example
  V380_PTZ_1_ID: "12345678"
  V380_PTZ_1_HOST: 192.168.1.10
  V380_PTZ_2_ID: "87654321"
  V380_PTZ_2_HOST: 192.168.1.11

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Provide the env file the backend and analytics services read
        run: cp .env.example .env
      - name: Validate the stack
        run: docker compose --env-file .env.example -f docker-compose.yml config -q
      - name: Validate the stack with the Jetson overlay
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.jetson.yml config -q
